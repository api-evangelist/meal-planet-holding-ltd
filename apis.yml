name: MEAL PLANET HOLDING LTD
description: >-
  MealPlanet (MEAL PLANET HOLDING LTD) is a UAE-based foodtech company, founded in 2024 by Khalid
  Baareh, that operates a meal-plan aggregation marketplace. Its consumer mobile app lets customers
  browse, compare, and subscribe to more than 500 personalised meal plans from 100+ trusted brands
  across the UAE, filtering by goal, calories, and dietary preferences, with flexible delivery and
  nutrition tracking. In 2024 the company closed a $6M seed round led by Middle East Venture Partners
  (MEVP) with participation from Sanabil 500 (the Sanabil Accelerator by 500 Global), AlTouq Group,
  Faith Capital, and Alturki Ventures, funding regional expansion beginning with Saudi Arabia.
  MealPlanet is a consumer-facing platform and publishes no public developer API, SDK, or
  documentation as of this enrichment pass.
